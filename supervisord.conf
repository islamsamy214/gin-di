[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:web-app]
command=%(ENV_SUPERVISOR_GO_COMMAND)s
user=%(ENV_SUPERVISOR_GO_USER)s
environment=GO_APP="1"

; The application traps SIGTERM and drains in-flight requests for up to 15s.
; TERM rather than supervisor's default so that handler is reached at all, and
; stopwaitsecs must exceed the drain window or supervisor SIGKILLs mid-shutdown
; and the graceful path is dead code.
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
